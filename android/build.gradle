group = "com.arkanefans.mnn_engine"

def pubspecText = file("../pubspec.yaml").getText("UTF-8")
def pubspecVersionMatcher = pubspecText =~ /(?m)^version:\s*([^\s]+)\s*$/
if (!pubspecVersionMatcher.find()) {
    throw new GradleException("Unable to read the mnn_engine version from pubspec.yaml.")
}
def mnnEngineVersion = pubspecVersionMatcher.group(1)
version = mnnEngineVersion

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def bundledNativeDir = file("src/main/jniLibs/arm64-v8a")
def bundledMnnLibrary = file("${bundledNativeDir}/libMNN.so")
def bundledJniLibrary = file("${bundledNativeDir}/libmnn_engine_jni.so")

tasks.register("verifyBundledMnnNativeArtifacts") {
    inputs.files(bundledMnnLibrary, bundledJniLibrary)
    doLast {
        def missingArtifacts = [bundledMnnLibrary, bundledJniLibrary].findAll {
            !it.isFile() || it.length() == 0
        }
        if (!missingArtifacts.isEmpty()) {
            throw new GradleException(
                "mnn_engine is missing its bundled Android arm64 native libraries: " +
                    missingArtifacts.collect { it.absolutePath }.join(", ")
            )
        }
    }
}

dependencies {
    implementation("androidx.documentfile:documentfile:1.0.1")
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("com.google.code.gson:gson:2.11.0")
    implementation("io.ktor:ktor-server-core:3.1.3")
    implementation("io.ktor:ktor-server-cio:3.1.3")
    implementation("io.ktor:ktor-server-call-logging:3.1.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1")
}

android {
    namespace = "com.arkanefans.mnn_engine"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 28
        buildConfigField "String", "MNN_ENGINE_VERSION", "\"${mnnEngineVersion}\""
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        buildConfig = true
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("verifyBundledMnnNativeArtifacts")
}
