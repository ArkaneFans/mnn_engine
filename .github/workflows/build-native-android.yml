name: Build Android native libraries
run-name: Android native · ${{ github.ref_name }} · ${{ (github.event_name == 'workflow_dispatch' && inputs.include_hexagon) && 'Hexagon (experimental)' || 'CPU/GPU' }}

on:
  workflow_dispatch:
    inputs:
      include_hexagon:
        description: Opt in to experimental Hexagon host and DSP builds (hidden in ServLlama)
        required: true
        default: false
        type: boolean
      hexagon_dsp_arch:
        description: DSP runtimes (all automatically matches the device; a single target makes a smaller APK)
        required: true
        default: all
        type: choice
        options:
          - all
          - v73
          - v75
          - v79
          - v81
      hexagon_toolchain:
        description: Docker uses the pinned Snapdragon image; sdk_archive uses your SDK secret and checksum
        required: true
        default: docker
        type: choice
        options:
          - docker
          - sdk_archive
      verify_example_apk:
        description: Also build and inspect the Flutter example APK in a separate job
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "native-v*"

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build and package ARM64 libraries
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      MNN_LOG_DIR: ${{ github.workspace }}/.native/logs/native
      INCLUDE_HEXAGON: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_hexagon) && 'true' || 'false' }}
      HEXAGON_DSP_ARCH: ${{ inputs.hexagon_dsp_arch || 'all' }}
      HEXAGON_TOOLCHAIN: ${{ inputs.hexagon_toolchain || 'docker' }}
    outputs:
      artifact_name: ${{ steps.bundle.outputs.name }}
    steps:
      - name: Check out the plugin and pinned MNN source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate options and record source revisions
        id: source
        env:
          HEXAGON_SDK_ARCHIVE_URL: ${{ secrets.HEXAGON_SDK_ARCHIVE_URL }}
          HEXAGON_SDK_ARCHIVE_SHA256: ${{ vars.HEXAGON_SDK_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "${MNN_LOG_DIR}"
          flavor=common
          if [[ "${INCLUDE_HEXAGON}" == true ]]; then
            [[ "${HEXAGON_DSP_ARCH}" =~ ^(all|v(73|75|79|81))$ ]] || {
              echo '::error::hexagon_dsp_arch must be all, v73, v75, v79 or v81.'
              exit 1
            }
            case "${HEXAGON_TOOLCHAIN}" in
              docker) ;;
              sdk_archive)
                [[ "${HEXAGON_SDK_ARCHIVE_URL}" == https://* ]] || {
                  echo '::error::Set HEXAGON_SDK_ARCHIVE_URL to an HTTPS URL for a prepared Linux SDK tar archive.'
                  exit 1
                }
                [[ "${HEXAGON_SDK_ARCHIVE_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]] || {
                  echo '::error::Set HEXAGON_SDK_ARCHIVE_SHA256 to the archive SHA-256.'
                  exit 1
                }
                ;;
              *) echo '::error::Unknown hexagon_toolchain.'; exit 1 ;;
            esac
            flavor="hexagon-${HEXAGON_DSP_ARCH}"
          fi
          mnn_commit="$(git -C MNN rev-parse HEAD)"
          workspace_id="$(printf '%s' "${GITHUB_WORKSPACE}" | sha256sum | cut -c1-12)"
          {
            echo "mnn_commit=${mnn_commit}"
            echo "short_commit=${mnn_commit:0:12}"
            echo "flavor=${flavor}"
            echo "cache_path=${HOME}/.cache/mnn_engine/${workspace_id}"
          } >> "${GITHUB_OUTPUT}"
          git rev-parse HEAD > "${MNN_LOG_DIR}/plugin-commit.txt"
          printf '%s\n' "${mnn_commit}" > "${MNN_LOG_DIR}/mnn-commit.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test SDK extraction and Hexagon artifact validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned native toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "cmake;3.22.1" "ndk;27.3.13750724"
          sudo apt-get update
          sudo apt-get install --yes ninja-build
          if [[ "${INCLUDE_HEXAGON}" == true && "${HEXAGON_TOOLCHAIN}" == sdk_archive ]]; then
            sudo apt-get install --yes libc6-i386 lib32stdc++6 libncurses5 libtinfo5 unzip make
          fi
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> "${GITHUB_ENV}"
          echo "MNN_CMAKE=${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake" >> "${GITHUB_ENV}"

      - name: Download and verify the optional Hexagon SDK
        if: env.INCLUDE_HEXAGON == 'true' && env.HEXAGON_TOOLCHAIN == 'sdk_archive'
        env:
          HEXAGON_SDK_ARCHIVE_URL: ${{ secrets.HEXAGON_SDK_ARCHIVE_URL }}
          HEXAGON_SDK_ARCHIVE_SHA256: ${{ vars.HEXAGON_SDK_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mnn-hexagon-sdk.tar"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 30 --max-time 1800 --proto '=https' --proto-redir '=https' \
            --output "${archive}" "${HEXAGON_SDK_ARCHIVE_URL}"
          sdk_root="$(python3 scripts/extract_hexagon_sdk.py \
            "${archive}" "${RUNNER_TEMP}/mnn-hexagon-sdk" "${HEXAGON_SDK_ARCHIVE_SHA256}")"
          echo "HEXAGON_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          printf '%s\n' "${HEXAGON_SDK_ARCHIVE_SHA256}" > "${MNN_LOG_DIR}/hexagon-sdk-sha256.txt"
          rm -- "${archive}"

      - name: Restore MNN and JNI build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.source.outputs.cache_path }}
            .native/generated
          key: mnn-native-v4-${{ runner.os }}-${{ env.INCLUDE_HEXAGON }}-${{ steps.source.outputs.mnn_commit }}-${{ hashFiles('scripts/build_mnn_android.sh', 'scripts/cmake/**', 'android/src/main/cpp/**') }}

      - name: Test the native adapter and tokenizer compatibility
        run: |
          set -euo pipefail
          bash scripts/test_mnn_llm_adapter.sh "${GITHUB_WORKSPACE}" 2>&1 | tee "${MNN_LOG_DIR}/native-tests.log"
          bash scripts/test_mnn_tokenizer.sh "${GITHUB_WORKSPACE}" 2>&1 | tee "${MNN_LOG_DIR}/tokenizer-tests.log"

      - name: Build MNN and the JNI bridge
        env:
          MNN_HEXAGON: ${{ env.INCLUDE_HEXAGON == 'true' && 'ON' || 'OFF' }}
        run: |
          set -euo pipefail
          bash scripts/build_mnn_android.sh "${GITHUB_WORKSPACE}" 2>&1 | tee "${MNN_LOG_DIR}/build-mnn.log"

      - name: Build the optional Hexagon stub and DSP libraries
        if: env.INCLUDE_HEXAGON == 'true'
        run: |
          set -euo pipefail
          build_script=scripts/build_hexagon_docker.sh
          if [[ "${HEXAGON_TOOLCHAIN}" == sdk_archive ]]; then
            build_script=scripts/build_hexagon_android.sh
            export MNN_HEXAGON_CMAKE="${MNN_CMAKE}"
          fi
          bash "${build_script}" "${GITHUB_WORKSPACE}" "${HEXAGON_DSP_ARCH}" \
            2>&1 | tee "${MNN_LOG_DIR}/build-hexagon.log"

      - name: Verify and package the native libraries
        run: |
          set -euo pipefail
          if [[ "${INCLUDE_HEXAGON}" == true ]]; then
            export MNN_HEXAGON_ARTIFACTS="${GITHUB_WORKSPACE}/.native/hexagon"
            if [[ "${HEXAGON_DSP_ARCH}" != all ]]; then
              MNN_HEXAGON_ARTIFACTS+="/${HEXAGON_DSP_ARCH}"
            fi
          fi
          bash scripts/package_mnn_artifacts.sh "${GITHUB_WORKSPACE}" 2>&1 | tee "${MNN_LOG_DIR}/package.log"

      - name: Assemble the downloadable bundle and checksums
        id: bundle
        env:
          BUNDLE_NAME: mnn-engine-android-arm64-${{ steps.source.outputs.flavor }}-${{ steps.source.outputs.short_commit }}
          HEXAGON_SDK_ARCHIVE_SHA256: ${{ vars.HEXAGON_SDK_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          bundle_root="dist/${BUNDLE_NAME}"
          mkdir -p "${bundle_root}/android/src/main/jniLibs" "${bundle_root}/native" \
            "${bundle_root}/.native/generated/arm64-v8a"
          cp -a android/src/main/jniLibs/arm64-v8a "${bundle_root}/android/src/main/jniLibs/"
          cp native/android-arm64-v8a.json "${bundle_root}/native/"
          cp .native/generated/arm64-v8a/libMNN.so .native/generated/arm64-v8a/libmnn_engine_jni.so \
            .native/generated/arm64-v8a/mnn_build_info.json "${bundle_root}/.native/generated/arm64-v8a/"
          cp -a LICENSE THIRD_PARTY_NOTICES.md third_party_licenses "${bundle_root}/"
          if [[ -d android/src/main/assets/mnn/hexagon ]]; then
            mkdir -p "${bundle_root}/android/src/main/assets/mnn"
            cp -a android/src/main/assets/mnn/hexagon "${bundle_root}/android/src/main/assets/mnn/"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("dist") / os.environ["BUNDLE_NAME"]
          manifest = json.loads((root / "native/android-arm64-v8a.json").read_text())
          hexagon = manifest["runtime"]["hexagon"]["runtimePackaged"]
          hexagon_builds = {
              arch: item["build"] for arch, item in
              json.loads((root / "android/src/main/assets/mnn/hexagon/manifest.json").read_text())["architectures"].items()
          } if hexagon else {}
          provenance = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pluginCommit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "runUrl": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "hexagonSdkArchiveSha256": os.environ["HEXAGON_SDK_ARCHIVE_SHA256"].lower()
                  if hexagon and os.environ["HEXAGON_TOOLCHAIN"] == "sdk_archive" else None,
              "hexagonToolchain": os.environ["HEXAGON_TOOLCHAIN"] if hexagon else None,
              "hexagonBuilds": hexagon_builds,
          }
          (root / "native/github-actions.json").write_text(json.dumps(provenance, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Android native artifacts\n\n")
              summary.write(f'- Download: **{os.environ["BUNDLE_NAME"]}**\n')
              summary.write(f'- MNN: {manifest["source"]["mnnVersion"]} ({manifest["source"]["mnnCommit"]})\n')
              summary.write(f'- JNI ABI: {manifest["build"]["nativeAdapterAbiVersion"]}; ARM64; 16 KB LOAD alignment\n')
              summary.write(f'- Compiled backends: {", ".join(manifest["runtime"]["compiledBackends"])}\n')
              summary.write(f'- Hexagon DSP runtime packaged: **{manifest["runtime"]["hexagon"]["runtimePackaged"]}**\n\n')
              if hexagon:
                  summary.write(f'- Auto-selected DSP runtimes: {", ".join(hexagon_builds)}\n')
                  for arch, build in hexagon_builds.items():
                      summary.write(f'- {arch}: SDK {build["sdkVersion"]}; {build["compilerVersion"]}; Android NDK {build["ndkVersion"]}\n')
                  summary.write(f'- Hexagon toolchain: {os.environ["HEXAGON_TOOLCHAIN"]}\n')
                  for image in sorted({build["containerImage"] for build in hexagon_builds.values() if build["containerImage"]}):
                      summary.write(f'- Docker image: `{image}`\n')
                  summary.write("\n")
              summary.write("The ZIP preserves plugin paths, native build inputs and SHA256SUMS. Device inference is not tested by this workflow.\n")
          PY
          (
            cd "${bundle_root}"
            find android native .native third_party_licenses LICENSE THIRD_PARTY_NOTICES.md \
              -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "name=${BUNDLE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "path=${bundle_root}" >> "${GITHUB_OUTPUT}"

      - name: Upload native libraries and resources
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.path }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-native-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MNN_LOG_DIR }}/
          retention-days: 14
          if-no-files-found: ignore

  verify-example:
    name: Verify the example APK
    needs: build-arm64
    if: github.event_name != 'workflow_dispatch' || inputs.verify_example_apk
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MNN_LOG_DIR: ${{ github.workspace }}/.native/logs/example
    steps:
      - name: Check out the plugin and pinned MNN source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clear previously bundled optional Hexagon resources
        run: |
          set -euo pipefail
          # A common artifact intentionally contains no DSP files. Downloading
          # it over a checkout with Hexagon resources must not retain them.
          rm -f -- android/src/main/jniLibs/arm64-v8a/libMNN_htpops.so
          rm -rf -- android/src/main/assets/mnn/hexagon

      - name: Download the native libraries from this run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-arm64.outputs.artifact_name }}
          path: .

      - name: Check the downloaded artifacts
        run: |
          set -euo pipefail
          mkdir -p "${MNN_LOG_DIR}"
          sha256sum --check SHA256SUMS

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the APK verification toolchain
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/27.3.13750724" >> "${GITHUB_ENV}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.2"
          cache: true

      - name: Analyze and test the plugin
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze 2>&1 | tee "${MNN_LOG_DIR}/analyze.log"
          flutter test 2>&1 | tee "${MNN_LOG_DIR}/tests.log"

      - name: Build and inspect the example APK
        id: apk
        run: |
          set -euo pipefail
          cd example
          # Pub regenerates the release registrant without dev-only plugins.
          flutter build apk --release --target-platform android-arm64 2>&1 | tee "${MNN_LOG_DIR}/apk.log"
          apk_path="$(find "${GITHUB_WORKSPACE}/example/build" -type f -path '*/outputs/flutter-apk/app-release.apk' -print -quit)"
          test -n "${apk_path}"
          bash "${GITHUB_WORKSPACE}/scripts/verify_mnn_artifacts.sh" "${GITHUB_WORKSPACE}" "${apk_path}" \
            2>&1 | tee "${MNN_LOG_DIR}/verify-apk.log"
          echo "path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload the verified example APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build-arm64.outputs.artifact_name }}-example-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Test Android runtime configuration and DSP extraction
        run: |
          set -euo pipefail
          cd example/android
          ./gradlew :mnn_engine:testDebugUnitTest 2>&1 | tee "${MNN_LOG_DIR}/kotlin-tests.log"

      - name: Upload example verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnn-example-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MNN_LOG_DIR }}/
          retention-days: 14
          if-no-files-found: ignore
